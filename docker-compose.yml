x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://checks:checks@db:5432/checks
  TEST_DATABASE_URL: postgresql+psycopg://checks:checks@db:5432/checks_test
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: checks
      POSTGRES_PASSWORD: checks
      POSTGRES_DB: checks
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checks"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *app-env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A app.tasks worker --beat --loglevel=info
    environment: *app-env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
